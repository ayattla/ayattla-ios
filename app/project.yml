# XcodeGen spec — on the Mac:  brew install xcodegen && cd app && xcodegen && open AyatTutla.xcodeproj
# STATUS: not generated or built yet (written without a Mac). Bundle id and team are placeholders.
name: AyatTutla
options:
  bundleIdPrefix: com.ayattla
  deploymentTarget: {iOS: "17.0"}
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: TODO_TEAM_ID
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AyatCalc: {path: Packages/AyatCalc}
  AyatContent: {path: Packages/AyatContent}
  AyatTiming: {path: Packages/AyatTiming}
  AyatDesign: {path: Packages/AyatDesign}
targets:
  AyatTutla:
    type: application
    platform: iOS
    sources:
      - App
      # content-v1.sqlite from the CI content job (not in git); copied as the "Content" folder
      - path: Content
        type: folder
        buildPhase: resources
    dependencies:
      - package: AyatCalc
      - package: AyatContent
      - package: AyatTiming
      - package: AyatDesign
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: آيات تتلى
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: لحساب مواقيت الصلاة واتجاه القبلة والمساجد القريبة
        NSPhotoLibraryAddUsageDescription: لحفظ المقاطع والبطاقات في الصور
        NSPhotoLibraryUsageDescription: لاختيار صورة خلفية من جهازك
        NSCameraUsageDescription: لالتقاط صورة خلفية
        ITSAppUsesNonExemptEncryption: false
  AyatTutlaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies: [{target: AyatTutla}]
