name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content pack (approved sources, verified)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tool tests
        run: |
          python3 tools/test_build_content_pack.py
          python3 tools/test_normalize_azkar.py
      - name: Fetch sources
        run: |
          mkdir -p src
          # Quran: Tanzil Uthmani text served by AlQuran Cloud (docs/CONTENT_AND_LICENSES.md)
          curl -sSf --retry 3 https://api.alquran.cloud/v1/quran/quran-uthmani -o src/quran-uthmani.json
          # Azkar: chapters of Hisn al-Muslim from osamayy/azkar-db
          git clone -q --depth 1 https://github.com/osamayy/azkar-db src/azkar-db
          echo "AZKAR_REF=$(git -C src/azkar-db rev-parse HEAD)" >> "$GITHUB_ENV"
          # Second copy of the Quran text straight from Tanzil, only for the byte comparison below
          curl -sSfL --retry 3 "https://tanzil.net/pub/download/index.php?marks=true&sajdah=true&rub=true&tatweel=false&quranType=uthmani&outType=txt-2&agree=true" -o src/tanzil-uthmani.txt || echo "tanzil download failed"
      - name: Reciter list from the live site (read only)
        run: curl -sSf --retry 3 -m 30 https://ayattla.com/api/meta -o src/meta.json
      - name: Tasbih page, prayer guide and duas from the live site (read only)
        run: |
          curl -sSf --retry 3 -m 30 https://ayattla.com/tools/tasbih -o src/tasbih.html
          curl -sSf --retry 3 -m 30 https://ayattla.com/tools/prayer-guide -o src/prayer-guide.html
          curl -sSf --retry 3 -m 30 https://ayattla.com/api/duas -o src/duas.json
          curl -sSf --retry 3 -m 30 https://ayattla.com/api/ruqya -o src/ruqya.json
          curl -sSf --retry 3 -m 30 https://ayattla.com/tools/asma-ul-husna -o src/asma.html
          # Ayat by topic: the list page, then one page per topic it links to
          curl -sSfL --retry 3 -m 30 https://ayattla.com/ayat/ -o src/ayat.html
          mkdir -p src/ayat
          for slug in $(sed -n '/<nav class="tools"/,/<\/nav>/p' src/ayat.html | grep -o 'href="/ayat/[a-z0-9_-]\+"' | sed 's|href="/ayat/||;s|"||' | sort -u); do
            curl -sSf --retry 3 -m 30 "https://ayattla.com/ayat/$slug" -o "src/ayat/$slug.html"
          done
          ls src/ayat
          # WhatsApp statuses by occasion: the list page, then each occasion page it links to
          curl -sSfL --retry 3 -m 30 https://ayattla.com/status/ -o src/status.html
          mkdir -p src/status
          for slug in $(grep -o 'href="/status/[a-z0-9-]\+"' src/status.html | sed 's|href="/status/||;s|"||' | sort -u); do
            [ "$slug" = editor ] && continue
            curl -sSf --retry 3 -m 30 "https://ayattla.com/status/$slug" -o "src/status/$slug.html" || echo "status $slug failed"
          done
          ls src/status
          # Quran.com's reciter list, to find the chapter-recitation id of each word-highlight reciter
          curl -sSf --retry 3 -m 30 "https://api.quran.com/api/v4/resources/chapter_reciters?language=en" -o src/qf-reciters.json
      - name: Fonts (Amiri Quran, Amiri, IBM Plex Sans Arabic; OFL 1.1)
        run: |
          mkdir -p pack
          curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/amiriquran/AmiriQuran-Regular.ttf -o pack/AmiriQuran-Regular.ttf
          curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/amiriquran/OFL.txt -o pack/AmiriQuran-OFL.txt
          # Amiri (OFL 1.1) for azkar text, as in design/Azkar.dc.html
          curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf -o pack/Amiri-Regular.ttf
          curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/amiri/OFL.txt -o pack/Amiri-OFL.txt
          # IBM Plex Sans Arabic (OFL 1.1), the site's interface font (--f-ui)
          for w in Regular Medium SemiBold Bold; do
            curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-$w.ttf -o pack/IBMPlexSansArabic-$w.ttf
          done
          curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/ibmplexsansarabic/OFL.txt -o pack/IBMPlexSansArabic-OFL.txt
          ls -l pack
      - name: Build pack
        run: |
          python3 tools/normalize_azkar.py src/azkar-db/azkar.json --source "osamayy/azkar-db@$AZKAR_REF" --out src/azkar.json
          mkdir -p pack
          python3 tools/build_content_pack.py --version 1 --quran src/quran-uthmani.json --azkar src/azkar.json --reciters src/meta.json --tasbih-html src/tasbih.html --guide-html src/prayer-guide.html --duas src/duas.json --ruqya src/ruqya.json --asma-html src/asma.html --topics-html src/ayat.html --topics-dir src/ayat --status-html src/status.html --status-dir src/status --qf-reciters src/qf-reciters.json --out pack/content-v1.sqlite
          python3 tools/check_content_sql.py app/Packages/AyatContent/Sources/AyatContent/ContentStore.swift pack/content-v1.sqlite
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect("pack/content-v1.sqlite")
          q = lambda s: db.execute(s).fetchall()
          print("surahs", q("select count(*) from surah"), "ayat", q("select count(*) from ayah"),
                "pages", q("select max(page) from ayah"), "basmala", q("select sum(basmala) from surah"))
          print("azkar", q("select c.id, c.title, count(z.id) from azkar_category c join azkar z on z.category=c.id group by c.id"))
          PY
          ls -l pack
      - name: Compare with Tanzil
        run: test -s src/tanzil-uthmani.txt && python3 tools/compare_tanzil.py pack/content-v1.sqlite src/tanzil-uthmani.txt
      - uses: actions/upload-artifact@v4
        with:
          name: content-pack
          path: pack/
          retention-days: 7

  packages:
    name: Swift packages (swift test)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (keep the toolchain the app was built with)
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Xcode version
        run: xcodebuild -version && swift --version
      - name: Test AyatCalc
        working-directory: app/Packages/AyatCalc
        run: swift test
      - name: Test AyatContent
        working-directory: app/Packages/AyatContent
        run: swift test
      - name: Test AyatTiming
        working-directory: app/Packages/AyatTiming
        run: swift test
      - name: Test AyatDesign
        working-directory: app/Packages/AyatDesign
        run: swift test

  app:
    name: App build, tests and screenshots (simulator)
    runs-on: macos-15-intel
    timeout-minutes: 75
    needs: [packages, content]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: content-pack
          path: app/Content
      - name: Select Xcode 16 (keep the toolchain the app was built with)
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: app
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          # Newest iOS runtime for the main run; the oldest supported one (iOS 18 and later) for a second pass.
          read UDID RT < <(xcrun simctl list devices available -j | python3 tools/pick_sim.py new)
          read OLD ORT < <(xcrun simctl list devices available -j | python3 tools/pick_sim.py old)
          echo "Main: $RT  Minimum: $ORT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: app
        run: |
          xcodebuild -project AyatTutla.xcodeproj -scheme AyatTutla \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= \
            -derivedDataPath build test | tee build.log | grep -E "error:|warning: |Test Suite|Executed|BUILD|TEST" || true
          test ${PIPESTATUS[0]} -eq 0
      - name: Tool checks on simulator (every run)
        # Opens the heavy tools with real data (long surahs, network) and fails on any crash report.
        if: success()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE=com.ayattla.AyatTutla
          xcrun simctl boot "$UDID" || true
          APP=$(find app/build/Build/Products -name "AyatTutla.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$BUNDLE" || true
          xcrun simctl location "$UDID" set 24.7136,46.6753 || true
          mkdir -p tools-shots; REP=~/Library/Logs/DiagnosticReports
          before=$(ls $REP 2>/dev/null | grep -ci ayattutla || true)
          run() {  # $1 shot name, $2 wait seconds, rest: launch args
            n=$1; w=$2; shift 2
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" "$@" >/dev/null
            sleep "$w"
            xcrun simctl io "$UDID" screenshot "tools-shots/$n.png" >/dev/null 2>&1
            if xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE"; then echo "✓ $n"; else echo "✗ $n (التطبيق لم يعد يعمل)"; fi
          }
          run intro-mid 1 -screen intro
          # «تجربة البداية»: each step (the saved step is where a closed app resumes), dark mode and the largest text.
          for st in hello uses likes listen reminders theme done; do run welcome-$st 5 -screen onboarding -welcome.step $st; done
          run welcome-uses-dark 5 -screen onboarding -welcome.step uses -settings.appearance dark
          run welcome-uses-xxxl 5 -screen onboarding -welcome.step uses -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityXXXL
          run welcome-home 8 -screen home -welcome.uses '(quran,status,azkar)'
          run intro-end 5 -screen intro
          run status-occasions 8 -screen status
          run status-jumuah 8 -screen status-jumuah
          run status-card 8 -screen status-card
          run prayer-week 8 -screen prayer
          run kaffarah 6 -screen kaffarah
          run crypto-zakat 6 -screen crypto-zakat
          run ruqya-new 8 -screen ruqya
          run mushaf-page 8 -screen mushaf
          run tajweed-fatiha 10 -screen tajweed -surah 1
          run tajweed-baqara 25 -screen tajweed -surah 2
          run tajweed-kahf 15 -screen tajweed -surah 18
          run tajweed-nisa 20 -screen tajweed -surah 4
          run wbw-baqara 30 -screen wbw -surah 2
          run khatma 6 -screen khatma
          run hifz 6 -screen hifz
          run hifz-plan 6 -screen hifz-plan
          run mosques 20 -screen mosques
          run hadith 15 -screen hadith
          run checker 6 -screen checker
          run radio 12 -screen radio
          run ruqya 6 -screen ruqya
          run asma 6 -screen asma
          run kids 6 -screen kids
          run kids-quiz 6 -screen kids-quiz
          run downloads 6 -screen downloads
          run duas 6 -screen duas
          run topics 6 -screen topics
          run prayer 8 -screen prayer
          run qibla 6 -screen qibla
          # Without internet (the app's own offline state): what was opened above must keep working.
          run offline-center 6 -screen offline
          run offline-center-off 6 -screen offline -offline 1
          run offline-home 10 -screen home -offline 1
          run offline-tajweed 10 -screen tajweed -surah 2 -offline 1
          run offline-hadith 10 -screen hadith -offline 1
          run offline-checker 6 -screen checker -offline 1
          run offline-radio 8 -screen radio -offline 1
          run offline-prayer 6 -screen prayer -offline 1
          run journey 6 -screen journey
          run week 6 -screen week
          run tasmee 6 -screen tasmee
          run voice-search 6 -screen voice-search
          xcrun simctl shutdown "$UDID" || true
          after=$(ls $REP 2>/dev/null | grep -ci ayattutla || true)
          echo "crash reports: $before → $after"
          if [ "$after" -gt "$before" ]; then ls -t $REP | grep -i ayattutla | head -3; for f in $(ls -t $REP | grep -i ayattutla | head -2); do head -c 3000 "$REP/$f"; done; exit 1; fi
      - name: iPad checks (every run)
        # The same app on an iPad simulator: main tabs and heavy tools, landscape too; crash reports fail the run.
        if: success()
        run: |
          IPAD=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(rt,x['udid'],x['name']) for rt,xs in d.items() if 'iOS' in rt for x in xs if 'iPad' in x['name']]
          c.sort()
          print(c[-1][1] if c else '')")
          if [ -z "$IPAD" ]; then echo "no iPad simulator"; exit 0; fi
          BUNDLE=com.ayattla.AyatTutla
          xcrun simctl boot "$IPAD" || true
          APP=$(find app/build/Build/Products -name "AyatTutla.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$IPAD" "$APP"
          xcrun simctl privacy "$IPAD" grant location "$BUNDLE" || true
          mkdir -p tools-shots; REP=~/Library/Logs/DiagnosticReports
          before=$(ls $REP 2>/dev/null | grep -ci ayattutla || true)
          run() {
            n=$1; w=$2; shift 2
            xcrun simctl launch --terminate-running-process "$IPAD" "$BUNDLE" "$@" >/dev/null
            sleep "$w"
            xcrun simctl io "$IPAD" screenshot "tools-shots/ipad-$n.png" >/dev/null 2>&1
            if xcrun simctl spawn "$IPAD" launchctl list | grep -q "$BUNDLE"; then echo "✓ iPad $n"; else echo "✗ iPad $n (التطبيق لم يعد يعمل)"; fi
          }
          run home 10
          run tajweed-baqara 25 -screen tajweed -surah 2
          run khatma 6 -screen khatma
          run notifications 8 -screen notifications
          run azkar 6 -screen azkar
          run studio 10 -screen studio
          run prayer 8 -screen prayer
          run hadith 15 -screen hadith
          xcrun simctl shutdown "$IPAD" || true
          after=$(ls $REP 2>/dev/null | grep -ci ayattutla || true)
          echo "iPad crash reports: $before → $after"
          [ "$after" -le "$before" ]
      - name: Publish tool screenshots to the ci-tools-shots branch
        if: always()
        run: |
          test -d tools-shots || exit 0
          cd tools-shots
          for f in *.png; do sips -Z 900 "$f" >/dev/null 2>&1 || true; done
          git init -q && git checkout -q -b ci-tools-shots
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "tool screens from run ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-tools-shots
      - name: Live preview on Appetize (main only)
        # The simulator build streamed in the browser: one link that always runs the latest main.
        # Needs the repository secret APPETIZE_API_TOKEN. The app's public key (not a secret) is kept in
        # app/appetize-public-key.txt after the first upload, so the link never changes.
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then echo "No APPETIZE_API_TOKEN secret; skipping"; exit 0; fi
          APP=$(find app/build/Build/Products -name "AyatTutla.app" -path "*iphonesimulator*" | head -1)
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/AyatTutla-sim.zip" AyatTutla.app)
          URL=https://api.appetize.io/v1/apps
          KEY=$(cat app/appetize-public-key.txt 2>/dev/null | tr -d '[:space:]')
          [ -n "$KEY" ] && URL="$URL/$KEY"
          curl -sS --fail-with-body -H "X-API-KEY: $APPETIZE_API_TOKEN" "$URL" \
            -F "file=@AyatTutla-sim.zip" -F "platform=ios" -F "note=main ${GITHUB_SHA::7}" > appetize.json
          python3 -c "import json;d=json.load(open('appetize.json'));print('publicKey', d.get('publicKey'));print('url', d.get('publicURL') or 'https://appetize.io/app/'+d.get('publicKey',''))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Screenshots on simulator
        # Screenshots only on main and manual runs; pull requests build and test only.
        if: success() && github.event_name == 'workflow_dispatch'
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE=com.ayattla.AyatTutla
          xcrun simctl boot "$UDID" || true
          APP=$(find app/build/Build/Products -name "AyatTutla.app" -path "*iphonesimulator*" | head -1)
          ls -d "$APP"/*.lproj || echo "no lproj in app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$BUNDLE" || true
          xcrun simctl location "$UDID" set 24.7136,46.6753 || true
          mkdir -p shots
          for s in home tools prayer qibla zakat hijri occasions mosques settings onboarding quran reader azkar azkar-session tasbih library khatma card studio qada sawm clip duas hadith checker guide radio hifz kids tajweed wbw ruqya asma downloads azkar-hub topics topic juz status status-jumuah status-card home-feed home-mid home-low about faq media media-image clip-video card-photo text-card reader-playing; do
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -screen "$s"
            case "$s" in clip-video|card-photo|media*|home-mid) sleep 15 ;; *) sleep 6 ;; esac
            xcrun simctl io "$UDID" screenshot "shots/$s.png"
          done
          # Dark mode, then the largest accessibility text size (light), for the main screens.
          xcrun simctl ui "$UDID" appearance dark
          for s in home tools prayer mosques settings onboarding home-feed home-mid home-low reader reader-playing card clip clip-video media azkar-session; do
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -screen "$s"
            case "$s" in clip-video|card-photo|media*|home-mid) sleep 15 ;; *) sleep 6 ;; esac
            xcrun simctl io "$UDID" screenshot "shots/$s-dark.png"
          done
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large
          for s in home tools prayer settings card; do
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -screen "$s"
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$s-xxxl.png"
          done
          xcrun simctl ui "$UDID" content_size large
          # Deep links: open the app on Home and follow a link at launch (ayah, evening azkar).
          xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -screen home -link "ayattla://ayah/2/255"; sleep 7
          xcrun simctl io "$UDID" screenshot "shots/link-ayah.png"
          xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -screen home -link "ayattla://azkar/%D8%A3%D8%B0%D9%83%D8%A7%D8%B1%20%D8%A7%D9%84%D9%85%D8%B3%D8%A7%D8%A1"; sleep 7
          xcrun simctl io "$UDID" screenshot "shots/link-azkar.png"
          xcrun simctl shutdown "$UDID" || true
          # iPad: two-column layouts.
          IPAD=$(xcrun simctl list devices available -j | python3 tools/pick_sim.py new iPad | cut -d' ' -f1)
          if [ -n "$IPAD" ]; then
            xcrun simctl boot "$IPAD" || true
            xcrun simctl bootstatus "$IPAD" -b || true
            xcrun simctl install "$IPAD" "$APP"
            xcrun simctl privacy "$IPAD" grant location "$BUNDLE" || true
            for s in home home-mid card card-photo clip-video reader-playing tools media; do
              xcrun simctl launch --terminate-running-process "$IPAD" "$BUNDLE" -screen "$s"
              case "$s" in clip-video|card-photo|media*|home-mid) sleep 15 ;; *) sleep 7 ;; esac
              xcrun simctl io "$IPAD" screenshot "shots/ipad-$s.png"
            done
          fi
      - name: Screenshots on a small and a large iPhone
        if: success() && github.event_name == 'workflow_dispatch'
        run: |
          BUNDLE=com.ayattla.AyatTutla
          APP=$(find app/build/Build/Products -name "AyatTutla.app" -path "*iphonesimulator*" | head -1)
          for size in small large; do
            DEV=$(xcrun simctl list devices available -j | python3 tools/pick_sim.py new $size | cut -d' ' -f1)
            [ -z "$DEV" ] && { echo "no $size iPhone"; continue; }
            xcrun simctl boot "$DEV" || true
            xcrun simctl bootstatus "$DEV" -b || true
            xcrun simctl install "$DEV" "$APP"
            for s in home home-mid tools card clip reader-playing; do
              xcrun simctl launch --terminate-running-process "$DEV" "$BUNDLE" -screen "$s"
              sleep 7
              xcrun simctl io "$DEV" screenshot "shots/$size-$s.png"
            done
            xcrun simctl shutdown "$DEV" || true
          done
      - name: Screenshots on the minimum iOS
        if: success() && github.event_name == 'workflow_dispatch' && steps.sim.outputs.old != steps.sim.outputs.udid
        run: |
          OLD="${{ steps.sim.outputs.old }}"
          BUNDLE=com.ayattla.AyatTutla
          xcrun simctl boot "$OLD" || true
          APP=$(find app/build/Build/Products -name "AyatTutla.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$OLD" "$APP"
          for s in home settings zakat card; do
            xcrun simctl launch --terminate-running-process "$OLD" "$BUNDLE" -screen "$s"
            sleep 6
            xcrun simctl io "$OLD" screenshot "shots/min-ios-$s.png"
          done
      - name: Publish screenshots to the ci-shots branch
        if: success() && github.event_name == 'workflow_dispatch'
        run: |
          cd shots
          for f in *.png; do sips -Z 1400 "$f" >/dev/null; done
          git init -q -b ci-shots
          git add *.png
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots from run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-output
          path: |
            app/build.log
            shots/
          if-no-files-found: ignore
