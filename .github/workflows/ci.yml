name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content pack (approved sources, verified)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tool tests
        run: |
          python3 tools/test_build_content_pack.py
          python3 tools/test_normalize_azkar.py
      - name: Fetch sources
        run: |
          mkdir -p src
          # Quran: Tanzil Uthmani text served by AlQuran Cloud (docs/CONTENT_AND_LICENSES.md)
          curl -sSf --retry 3 https://api.alquran.cloud/v1/quran/quran-uthmani -o src/quran-uthmani.json
          # Azkar: chapters of Hisn al-Muslim from osamayy/azkar-db
          git clone -q --depth 1 https://github.com/osamayy/azkar-db src/azkar-db
          echo "AZKAR_REF=$(git -C src/azkar-db rev-parse HEAD)" >> "$GITHUB_ENV"
          # Second copy of the Quran text straight from Tanzil, only for the byte comparison below
          curl -sSfL --retry 3 "https://tanzil.net/pub/download/index.php?marks=true&sajdah=true&rub=true&tatweel=false&quranType=uthmani&outType=txt-2&agree=true" -o src/tanzil-uthmani.txt || echo "tanzil download failed"
      - name: Reciter list from the live site (read only)
        run: curl -sSf --retry 3 -m 30 https://ayattla.com/api/meta -o src/meta.json
      - name: Tasbih page, prayer guide and duas from the live site (read only)
        run: |
          curl -sSf --retry 3 -m 30 https://ayattla.com/tools/tasbih -o src/tasbih.html
          curl -sSf --retry 3 -m 30 https://ayattla.com/tools/prayer-guide -o src/prayer-guide.html
          curl -sSf --retry 3 -m 30 https://ayattla.com/api/duas -o src/duas.json
          curl -sSf --retry 3 -m 30 https://ayattla.com/api/ruqya -o src/ruqya.json
          curl -sSf --retry 3 -m 30 https://ayattla.com/tools/asma-ul-husna -o src/asma.html
          # Ayat by topic: the list page, then one page per topic it links to
          curl -sSfL --retry 3 -m 30 https://ayattla.com/ayat/ -o src/ayat.html
          mkdir -p src/ayat
          for slug in $(sed -n '/<nav class="tools"/,/<\/nav>/p' src/ayat.html | grep -o 'href="/ayat/[a-z0-9_-]\+"' | sed 's|href="/ayat/||;s|"||' | sort -u); do
            curl -sSf --retry 3 -m 30 "https://ayattla.com/ayat/$slug" -o "src/ayat/$slug.html"
          done
          ls src/ayat
          # Quran.com's reciter list, to find the chapter-recitation id of each word-highlight reciter
          curl -sSf --retry 3 -m 30 "https://api.quran.com/api/v4/resources/chapter_reciters?language=en" -o src/qf-reciters.json
      - name: Fonts (Amiri Quran, Amiri, IBM Plex Sans Arabic; OFL 1.1)
        run: |
          mkdir -p pack
          curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/amiriquran/AmiriQuran-Regular.ttf -o pack/AmiriQuran-Regular.ttf
          curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/amiriquran/OFL.txt -o pack/AmiriQuran-OFL.txt
          # Amiri (OFL 1.1) for azkar text, as in design/Azkar.dc.html
          curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf -o pack/Amiri-Regular.ttf
          curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/amiri/OFL.txt -o pack/Amiri-OFL.txt
          # IBM Plex Sans Arabic (OFL 1.1), the site's interface font (--f-ui)
          for w in Regular Medium SemiBold Bold; do
            curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-$w.ttf -o pack/IBMPlexSansArabic-$w.ttf
          done
          curl -sSfL --retry 3 https://github.com/google/fonts/raw/main/ofl/ibmplexsansarabic/OFL.txt -o pack/IBMPlexSansArabic-OFL.txt
          ls -l pack
      - name: Build pack
        run: |
          python3 tools/normalize_azkar.py src/azkar-db/azkar.json --source "osamayy/azkar-db@$AZKAR_REF" --out src/azkar.json
          mkdir -p pack
          python3 tools/build_content_pack.py --version 1 --quran src/quran-uthmani.json --azkar src/azkar.json --reciters src/meta.json --tasbih-html src/tasbih.html --guide-html src/prayer-guide.html --duas src/duas.json --ruqya src/ruqya.json --asma-html src/asma.html --topics-html src/ayat.html --topics-dir src/ayat --qf-reciters src/qf-reciters.json --out pack/content-v1.sqlite
          python3 tools/check_content_sql.py app/Packages/AyatContent/Sources/AyatContent/ContentStore.swift pack/content-v1.sqlite
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect("pack/content-v1.sqlite")
          q = lambda s: db.execute(s).fetchall()
          print("surahs", q("select count(*) from surah"), "ayat", q("select count(*) from ayah"),
                "pages", q("select max(page) from ayah"), "basmala", q("select sum(basmala) from surah"))
          print("azkar", q("select c.id, c.title, count(z.id) from azkar_category c join azkar z on z.category=c.id group by c.id"))
          PY
          ls -l pack
      - name: Compare with Tanzil
        run: test -s src/tanzil-uthmani.txt && python3 tools/compare_tanzil.py pack/content-v1.sqlite src/tanzil-uthmani.txt
      - uses: actions/upload-artifact@v4
        with:
          name: content-pack
          path: pack/
          retention-days: 7

  packages:
    name: Swift packages (swift test)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (macOS 14 images default to Xcode 15)
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Xcode version
        run: xcodebuild -version && swift --version
      - name: Test AyatCalc
        working-directory: app/Packages/AyatCalc
        run: swift test
      - name: Test AyatContent
        working-directory: app/Packages/AyatContent
        run: swift test
      - name: Test AyatTiming
        working-directory: app/Packages/AyatTiming
        run: swift test
      - name: Test AyatDesign
        working-directory: app/Packages/AyatDesign
        run: swift test

  app:
    name: App build, tests and screenshots (simulator)
    runs-on: macos-14
    timeout-minutes: 45
    needs: [packages, content]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: content-pack
          path: app/Content
      - name: Select Xcode 16 (macOS 14 images default to Xcode 15)
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: app
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          # Newest iOS runtime for the main run; the oldest supported one (iOS 18 and later) for a second pass.
          read UDID RT < <(xcrun simctl list devices available -j | python3 tools/pick_sim.py new)
          read OLD ORT < <(xcrun simctl list devices available -j | python3 tools/pick_sim.py old)
          echo "Main: $RT  Minimum: $ORT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: app
        run: |
          xcodebuild -project AyatTutla.xcodeproj -scheme AyatTutla \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= \
            -derivedDataPath build test | tee build.log | grep -E "error:|warning: |Test Suite|Executed|BUILD|TEST" || true
          test ${PIPESTATUS[0]} -eq 0
      - name: Screenshots on simulator
        if: success()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE=com.ayattla.AyatTutla
          xcrun simctl boot "$UDID" || true
          APP=$(find app/build/Build/Products -name "AyatTutla.app" -path "*iphonesimulator*" | head -1)
          ls -d "$APP"/*.lproj || echo "no lproj in app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$BUNDLE" || true
          xcrun simctl location "$UDID" set 24.7136,46.6753 || true
          mkdir -p shots
          for s in home tools prayer qibla zakat hijri occasions mosques settings onboarding quran reader azkar azkar-session tasbih library khatma card studio qada sawm clip duas hadith checker guide radio hifz kids tajweed wbw ruqya asma downloads azkar-hub topics topic juz status; do
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -screen "$s"
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$s.png"
          done
          # Dark mode, then the largest accessibility text size (light), for the main screens.
          xcrun simctl ui "$UDID" appearance dark
          for s in tools prayer mosques settings onboarding home-feed reader azkar-session; do
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -screen "$s"
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$s-dark.png"
          done
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large
          for s in tools prayer settings; do
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -screen "$s"
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$s-xxxl.png"
          done
          xcrun simctl ui "$UDID" content_size large
          # Deep links: open the app on Home and follow a link at launch (ayah, evening azkar).
          xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -screen home -link "ayattla://ayah/2/255"; sleep 7
          xcrun simctl io "$UDID" screenshot "shots/link-ayah.png"
          xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -screen home -link "ayattla://azkar/%D8%A3%D8%B0%D9%83%D8%A7%D8%B1%20%D8%A7%D9%84%D9%85%D8%B3%D8%A7%D8%A1"; sleep 7
          xcrun simctl io "$UDID" screenshot "shots/link-azkar.png"
          xcrun simctl shutdown "$UDID" || true
          # iPad: two-column layouts.
          IPAD=$(xcrun simctl list devices available -j | python3 tools/pick_sim.py new iPad | cut -d' ' -f1)
          if [ -n "$IPAD" ]; then
            xcrun simctl boot "$IPAD" || true
            xcrun simctl bootstatus "$IPAD" -b || true
            xcrun simctl install "$IPAD" "$APP"
            xcrun simctl privacy "$IPAD" grant location "$BUNDLE" || true
            for s in home card clip reader tools; do
              xcrun simctl launch --terminate-running-process "$IPAD" "$BUNDLE" -screen "$s"
              sleep 7
              xcrun simctl io "$IPAD" screenshot "shots/ipad-$s.png"
            done
          fi
      - name: Screenshots on the minimum iOS
        if: success() && steps.sim.outputs.old != steps.sim.outputs.udid
        run: |
          OLD="${{ steps.sim.outputs.old }}"
          BUNDLE=com.ayattla.AyatTutla
          xcrun simctl boot "$OLD" || true
          APP=$(find app/build/Build/Products -name "AyatTutla.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$OLD" "$APP"
          for s in home settings zakat card; do
            xcrun simctl launch --terminate-running-process "$OLD" "$BUNDLE" -screen "$s"
            sleep 6
            xcrun simctl io "$OLD" screenshot "shots/min-ios-$s.png"
          done
      - name: Live preview on Appetize (main only)
        # The simulator build streamed in the browser: one link that always runs the latest main.
        # Needs the repository secret APPETIZE_API_TOKEN. The app's public key (not a secret) is kept in
        # app/appetize-public-key.txt after the first upload, so the link never changes.
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then echo "No APPETIZE_API_TOKEN secret; skipping"; exit 0; fi
          APP=$(find app/build/Build/Products -name "AyatTutla.app" -path "*iphonesimulator*" | head -1)
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/AyatTutla-sim.zip" AyatTutla.app)
          URL=https://api.appetize.io/v1/apps
          KEY=$(cat app/appetize-public-key.txt 2>/dev/null | tr -d '[:space:]')
          [ -n "$KEY" ] && URL="$URL/$KEY"
          curl -sS --fail-with-body -H "X-API-KEY: $APPETIZE_API_TOKEN" "$URL" \
            -F "file=@AyatTutla-sim.zip" -F "platform=ios" -F "note=main ${GITHUB_SHA::7}" > appetize.json
          python3 -c "import json;d=json.load(open('appetize.json'));print('publicKey', d.get('publicKey'));print('url', d.get('publicURL') or 'https://appetize.io/app/'+d.get('publicKey',''))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish screenshots to the ci-shots branch
        if: success()
        run: |
          cd shots
          for f in *.png; do sips -Z 1400 "$f" >/dev/null; done
          git init -q -b ci-shots
          git add *.png
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots from run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-output
          path: |
            app/build.log
            shots/
          if-no-files-found: ignore
