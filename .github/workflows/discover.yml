name: Discover site APIs (temporary, read only)
on:
  push:
    branches: ['claude/discover-*']
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Brand files as base64
        run: |
          sudo apt-get install -y -qq librsvg2-bin >/dev/null
          B=https://ayattla.com/tools
          for f in favicon logo-full logo-full-light logo-horizontal logo-horizontal-light; do
            curl -sSf -m 30 $B/$f.svg -o $f.svg
            echo "B64 $f.svg $(base64 -w0 $f.svg)"
          done
          # App icon: the favicon mark on a full square (iOS rounds the corners itself)
          sed 's/rx="112"//' favicon.svg > icon-square.svg
          rsvg-convert -w 1024 -h 1024 icon-square.svg -o AppIcon-1024.png
          python3 -c "
          import struct,zlib;d=open('AppIcon-1024.png','rb').read();print('PNG', len(d))"
          echo "B64 AppIcon-1024.png $(base64 -w0 AppIcon-1024.png)"
