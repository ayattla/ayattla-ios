name: Discover site APIs (temporary, read only)
on:
  push:
    branches: ['claude/discover-*']
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Read
        run: |
          B=https://ayattla.com
          curl -sS -m 30 $B/ -o h.html; curl -sS -m 30 $B/tools/tajweed -o t.html; curl -sS -m 30 $B/tools/asma-ul-husna -o a.html
          python3 - <<'PY'
          import re, json
          for name in ["h.html", "t.html"]:
              s = open(name, encoding="utf-8").read()
              css = " ".join(re.findall(r"<style[^>]*>(.*?)</style>", s, re.S))
              print("===", name, len(css))
              for m in re.finditer(r"(:root[^{]*|\[data-theme=dark\][^{]*|html\[data-theme=.dark.\][^{]*)\{([^}]*)\}", css):
                  print("ROOT", m.group(1)[:60], m.group(2)[:2500])
              for m in re.finditer(r"(\.tj-[a-z_]+[^{]*)\{([^}]*)\}", css):
                  print("TJ", m.group(1), m.group(2))
              for k in ["body{", ".hero", ".card{", ".btn{", "h1{", ".tool-card", "--grad", "border-radius"]:
                  i = css.find(k)
                  if i >= 0: print("CSS", k, css[i:i+300])
          s = open("a.html", encoding="utf-8").read()
          i = s.find("const AS=")
          j = s.find("];", i)
          arr = json.loads(s[i+9:j+1])
          print("ASMA", len(arr), arr[:2], arr[-1], sorted(set(k for x in arr for k in x)))
          print("ASMA_JS", s[j:j+1800])
          PY
