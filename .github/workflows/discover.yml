name: Discover site APIs (temporary, read only)
on:
  push:
    branches: ['claude/discover-*']
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Prayer guide HTML structure
        run: |
          curl -sS -m 30 https://ayattla.com/tools/prayer-guide -o g.html
          python3 -c "
          s=open('g.html').read(); i=s.find('<main'); j=s.find('</main>')
          m=s[i:j]; k=m.rfind('</style>'); print(m[k:k+2500])"
