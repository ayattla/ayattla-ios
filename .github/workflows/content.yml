name: Content pack

# Builds content.sqlite from the approved sources (docs/CONTENT_AND_LICENSES.md) on a runner that
# can reach them. Religious text is copied byte for byte; nothing is typed or edited by hand.
on:
  push:
    paths: [tools/**, .github/workflows/content.yml]
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Look at azkar-db
        run: |
          git clone --depth 1 https://github.com/osamayy/azkar-db azkar-db
          cd azkar-db && git log -1 --format='%H %ad' && find . -path ./.git -prune -o -type f -printf '%s %p\n' | sort -k2 | head -60
          for f in $(find . -path ./.git -prune -o -type f \( -name '*.json' -o -name '*.csv' -o -name '*.sql' -o -name '*.md' \) -print | head -8); do
            echo "=== $f"; head -c 1500 "$f"; echo; done
      - name: Look at AlQuran Cloud
        run: |
          curl -sSf https://api.alquran.cloud/v1/quran/quran-uthmani -o q.json
          ls -l q.json
          python3 -c "import json;d=json.load(open('q.json'))['data'];print(d['edition']);s=d['surahs'][0];print(s['name'],s['englishName'],len(s['ayahs']),s['ayahs'][0])"
