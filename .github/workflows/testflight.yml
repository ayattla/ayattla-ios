name: TestFlight

# Manual: Actions → TestFlight → Run workflow. Builds a Release archive of main with the
# content pack, signs it with automatic signing through an App Store Connect API key, and
# uploads it to TestFlight. Needs these repository secrets (Settings → Secrets → Actions):
#   APPLE_TEAM_ID          10-character team id from developer.apple.com → Membership
#   ASC_KEY_ID             App Store Connect → Users and Access → Integrations → Keys (role: App Manager)
#   ASC_ISSUER_ID          shown on the same page
#   ASC_KEY_P8             contents of the downloaded AuthKey_XXXX.p8 file
# The build number is the run number, so every upload is accepted as a new build.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (see docs/TESTFLIGHT.md)"; exit 1; fi
      - uses: actions/checkout@v4
      # The verified content pack from the latest successful «iOS CI» run on main.
      - name: Find the content pack
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "${{ github.repository }}" --workflow "iOS CI" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          [ -n "$id" ] || { echo "::error::No successful iOS CI run on main"; exit 1; }
          echo "run=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: content-pack
          path: app/Content
          run-id: ${{ steps.pack.outputs.run }}
          github-token: ${{ github.token }}
      - name: Select Xcode 16
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$P8" > ~/.appstoreconnect/private_keys/AuthKey_$KEY.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_$KEY.p8" >> "$GITHUB_ENV"
      - name: Generate project
        working-directory: app
        run: brew install xcodegen && xcodegen generate
      - name: Archive
        working-directory: app
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project AyatTutla.xcodeproj -scheme AyatTutla -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/AyatTutla.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY" -authenticationKeyIssuerID "$ISSUER" | tail -80
      - name: Export
        working-directory: app
        env:
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/AyatTutla.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY" -authenticationKeyIssuerID "$ISSUER" | tail -40
          ls build/export
      - name: Upload to TestFlight
        working-directory: app
        env:
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app -f build/export/AyatTutla.ipa -t ios --apiKey "$KEY" --apiIssuer "$ISSUER"
      - name: Remove key
        if: always()
        run: rm -rf ~/.appstoreconnect
