<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قارئ المصحف</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#2C5E37}a:hover{color:#1F4628}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF9F2; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E8E2D0">
    <button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 16px; font-weight: 600">[اسم السورة]</span>
      <span style="font-size: 12px; color: #5E5A48">الجزء [رقم] · صفحة [رقم]</span>
    </div>
    <button aria-label="خيارات العرض" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  </div>

  <div role="tablist" aria-label="طبقات العرض" style="display: flex; gap: 8px; padding: 12px 16px; overflow: hidden">
    <button role="tab" aria-selected="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: {{accent}}; color: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif">المصحف</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3EBE5; background: #FFFFFF; color: #1C2B20; font: 500 13px 'IBM Plex Sans Arabic', sans-serif">التجويد</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3EBE5; background: #FFFFFF; color: #1C2B20; font: 500 13px 'IBM Plex Sans Arabic', sans-serif">معاني الكلمات</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3EBE5; background: #FFFFFF; color: #1C2B20; font: 500 13px 'IBM Plex Sans Arabic', sans-serif">التفسير</button>
  </div>

  <div style="flex: 1; margin: 4px 16px 0; border: 1px solid #E8E2D0; border-radius: 18px; background: #FFFDF7; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">
    <div style="height: 40px; border-radius: 10px; border: 1px solid #D9CFAE; display: flex; align-items: center; justify-content: center; font-family: 'Amiri Quran', serif; font-size: 18px; color: #2F6B3B">[ترويسة السورة]</div>
    <p style="margin: 0; font-family: 'Amiri Quran', serif; font-size: 21px; line-height: 2.2; text-align: center; color: #5E5A48">[نص الصفحة ١٥ سطرا من مصحف Tanzil — يرسم بـ CoreText]</p>
    <div style="display: flex; flex-direction: column; gap: 22px; padding-top: 6px">
      <div style="display: flex; gap: 8px; align-items: center"><div style="flex: 3; height: 12px; border-radius: 6px; background: #ECE6D3"></div><div style="flex: 2; height: 12px; border-radius: 6px; background: #ECE6D3"></div><div style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid #B79A4E"></div><div style="flex: 2; height: 12px; border-radius: 6px; background: #ECE6D3"></div></div>
      <div style="display: flex; gap: 8px; align-items: center"><div style="flex: 2; height: 12px; border-radius: 6px; background: #ECE6D3"></div><div style="flex: 1; height: 20px; border-radius: 6px; background: {{highlight}}"></div><div style="flex: 3; height: 12px; border-radius: 6px; background: #ECE6D3"></div></div>
      <div style="display: flex; gap: 8px; align-items: center"><div style="flex: 4; height: 12px; border-radius: 6px; background: #ECE6D3"></div><div style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid #B79A4E"></div><div style="flex: 2; height: 12px; border-radius: 6px; background: #ECE6D3"></div></div>
      <div style="display: flex; gap: 8px; align-items: center"><div style="flex: 3; height: 12px; border-radius: 6px; background: #ECE6D3"></div><div style="flex: 3; height: 12px; border-radius: 6px; background: #ECE6D3"></div></div>
      <div style="display: flex; gap: 8px; align-items: center"><div style="flex: 2; height: 12px; border-radius: 6px; background: #ECE6D3"></div><div style="flex: 4; height: 12px; border-radius: 6px; background: #ECE6D3"></div><div style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid #B79A4E"></div></div>
    </div>
  </div>

  <div style="margin: 12px 16px 0; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3EBE5; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #56665B"><span>[اسم القارئ] · تظليل الكلمات</span><span>٠:٤٢ / ٣:١٠</span></div>
    <div style="height: 4px; border-radius: 2px; background: #EEF5EF"><div style="width: 24%; height: 4px; border-radius: 2px; background: {{accent}}"></div></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="تكرار" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56665B" stroke-width="1.8" aria-hidden="true"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"></path></svg></button>
      <button aria-label="الآية التالية" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#2C5E37" aria-hidden="true"><path d="M18 6v12l-8-6zM10 6v12l-8-6z"></path></svg></button>
      <button aria-label="إيقاف مؤقت" style="width: 52px; height: 52px; border: 0; border-radius: 26px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
      <button aria-label="الآية السابقة" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#2C5E37" aria-hidden="true"><path d="M6 6v12l8-6zM14 6v12l8-6z"></path></svg></button>
      <button style="height: 36px; padding: 0 10px; border: 1px solid #E3EBE5; border-radius: 18px; background: #FFFFFF; font: 500 12px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">١٫٠×</button>
    </div>
  </div>
  <div style="height: 34px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#427E45"},"highlight":{"editor":"color","default":"#F3D27A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#427E45', highlight: this.props.highlight ?? '#F3D27A' };
}
}
</script>
</body>
</html>
