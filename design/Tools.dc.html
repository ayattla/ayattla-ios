<!doctype html>
<html lang="ar" dir="rtl">
<head>

</head>

<x-dc>
<helmet>

a{color:#2C5E37}a:hover{color:#1F4628}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7FAF7; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600">الأدوات</h1>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; background: #EAF1EB">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44544A" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input type="search" placeholder="ابحث عن أداة" aria-label="ابحث عن أداة" style="flex: 1; border: 0; background: transparent; font: 400 15px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; outline: none">
    </label>

    <div style="border-radius: 16px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E3EBE5; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #56665B">الصلاة القادمة</span><span style="font-size: 20px; font-weight: 600; color: {{accent}}">[الصلاة] · [الوقت]</span><span style="font-size: 12px; color: #56665B">[المدينة] · بعد [المدة]</span></div>
      <button aria-label="القبلة" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid #E3EBE5; background: #EEF5EF; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 5l3 7-3 7-3-7z" fill="#2C5E37"></path></svg></button>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 15px; font-weight: 600; color: #44544A">اليوم</h2>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px">
      <button style="height: 88px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><path d="M12 3a6 6 0 0 0 6 9 6 6 0 1 1-6-9z"></path></svg>الأذكار</button>
      <button style="height: 88px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="7" cy="9" r="2"></circle><circle cx="17" cy="9" r="2"></circle><circle cx="8" cy="15" r="2"></circle><circle cx="16" cy="15" r="2"></circle><path d="M12 17v4"></path></svg>المسبحة</button>
      <button style="height: 88px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><path d="M7 11V7a5 5 0 0 1 10 0v4M5 11h14v9H5z"></path></svg>الأدعية</button>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 15px; font-weight: 600; color: #44544A">العبادات والحساب</h2>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px">
      <button style="height: 88px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>الهجري</button>
      <button style="height: 88px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"></path></svg>الزكاة</button>
      <button style="height: 88px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>قضاء الصلوات</button>
      <button style="height: 88px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><path d="M12 3a6 6 0 0 0 6 9 6 6 0 1 1-6-9z"></path><path d="M4 20h16"></path></svg>الصيام</button>
      <button style="height: 88px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"></path><circle cx="12" cy="10" r="2"></circle></svg>المساجد</button>
      <button style="height: 88px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"></path></svg>الأحاديث</button>
    </div>
    <a href="#" style="font-size: 13px; align-self: center; padding: 10px">كل الأدوات ([العدد])</a>
  </div>

  <nav aria-label="التبويبات" style="height: 84px; box-sizing: border-box; padding: 8px 8px 28px; border-top: 1px solid #E3EBE5; background: #FFFFFF; display: grid; grid-template-columns: repeat(5, 1fr)">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; text-decoration: none; color: #56665B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#56665B" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>الرئيسية</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; text-decoration: none; color: #56665B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#56665B" stroke-width="1.8" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"></path><path d="M12 6v14"></path></svg>القرآن</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; text-decoration: none; color: #56665B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#56665B" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M10 9l5 3-5 3z"></path></svg>الاستوديو</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; text-decoration: none; color: #56665B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#56665B" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="6" height="16" rx="1.5"></rect><rect x="12" y="4" width="6" height="16" rx="1.5"></rect></svg>مكتبتي</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; text-decoration: none; color: #2C5E37"><svg width="24" height="24" viewBox="0 0 24 24" fill="#427E45" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>الأدوات</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2C5E37"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2C5E37' };
}
}
</script>
</body>
</html>
