<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الرئيسية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#2C5E37}a:hover{color:#1F4628}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7FAF7; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; overflow: hidden; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #56665B">[التاريخ الهجري]</span>
        <h1 style="margin: 0; font-size: 28px; font-weight: 600; color: {{accent}}">آيات تتلى</h1>
      </div>
      <button aria-label="الإعدادات" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E3EBE5; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"></path></svg>
      </button>
    </div>

    <div style="border-radius: 20px; padding: 20px; background: linear-gradient(160deg, #2F6B3B, #427E45); color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; font-weight: 500; opacity: .9">آية اليوم</span>
        <span style="font-size: 12px; opacity: .85">[السورة] · [رقم الآية]</span>
      </div>
      <p style="margin: 0; font-family: 'Amiri Quran', serif; font-size: 22px; line-height: 2.2; text-align: center; opacity: .95">[نص الآية من مصحف Tanzil]</p>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #2C5E37; font: 600 14px 'IBM Plex Sans Arabic', sans-serif">اصنع مقطعا</button>
        <button aria-label="استمع" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,.5); background: transparent; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
        </button>
        <button aria-label="أضف للمفضلة" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,.5); background: transparent; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
        </button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px">
      <button style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 12px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5EF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M10 9l5 3-5 3z"></path></svg></span>مقطع
      </button>
      <button style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 12px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5EF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg></span>بطاقة
      </button>
      <button style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 12px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5EF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="3"></rect><path d="M10 18h4"></path></svg></span>حالة
      </button>
      <button style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 12px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5EF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><path d="M4 8h16v12H4zM2 8h20M12 8v12M12 8c-2-4-6-4-6-1s6 1 6 1 6 2 6-1-4-3-6 1"></path></svg></span>إهداء
      </button>
    </div>

    <div style="border-radius: 16px; border: 1px solid #E3EBE5; background: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #EEF5EF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"></path><path d="M12 6v14"></path></svg></span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; font-weight: 600">تابع القراءة</span>
        <span style="font-size: 13px; color: #56665B">[السورة] · صفحة [رقم]</span>
        <div style="height: 6px; border-radius: 3px; background: #EEF5EF"><div style="width: 38%; height: 6px; border-radius: 3px; background: {{accent}}"></div></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 17px; font-weight: 600">آخر المشاريع</h2>
        <a href="#" style="font-size: 13px">عرض الكل</a>
      </div>
      <div style="display: flex; gap: 10px">
        <div style="width: 104px; height: 148px; border-radius: 14px; background: linear-gradient(180deg, #33493A, #1E2E23); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="font-size: 11px; color: #FFFFFF">مقطع · ٩:١٦</span></div>
        <div style="width: 104px; height: 148px; border-radius: 14px; background: linear-gradient(180deg, #4E6E57, #2F6B3B); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="font-size: 11px; color: #FFFFFF">بطاقة · ١:١</span></div>
        <div style="width: 104px; height: 148px; border-radius: 14px; border: 1.5px dashed #B9CDBE; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; color: #2C5E37; font-size: 12px; box-sizing: border-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>مشروع جديد</div>
      </div>
    </div>
  </div>

  <nav aria-label="التبويبات" style="height: 84px; box-sizing: border-box; padding: 8px 8px 28px; border-top: 1px solid #E3EBE5; background: #FFFFFF; display: grid; grid-template-columns: repeat(5, 1fr)">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; text-decoration: none; color: #2C5E37"><svg width="24" height="24" viewBox="0 0 24 24" fill="#427E45" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>الرئيسية</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; text-decoration: none; color: #56665B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#56665B" stroke-width="1.8" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"></path><path d="M12 6v14"></path></svg>القرآن</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; text-decoration: none; color: #56665B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#56665B" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M10 9l5 3-5 3z"></path></svg>الاستوديو</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; text-decoration: none; color: #56665B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#56665B" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="6" height="16" rx="1.5"></rect><rect x="12" y="4" width="6" height="16" rx="1.5"></rect></svg>مكتبتي</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; text-decoration: none; color: #56665B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#56665B" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>الأدوات</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#427E45"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#427E45' };
}
}
</script>
</body>
</html>
