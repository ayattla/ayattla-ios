<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>محرر بطاقة الآية</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#2C5E37}a:hover{color:#1F4628}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7FAF7; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C2B20" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <span style="font-size: 16px; font-weight: 600">بطاقة آية</span>
    <button style="height: 40px; padding: 0 18px; border-radius: 20px; border: 0; background: {{accent}}; color: #FFFFFF; font: 600 14px 'IBM Plex Sans Arabic', sans-serif">مشاركة</button>
  </div>

  <div style="display: flex; justify-content: center; padding: 8px 0 14px">
    <div style="width: 310px; height: 310px; border-radius: 18px; overflow: hidden; position: relative; background: linear-gradient(160deg, #4E6E57, #22322A); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; box-sizing: border-box; gap: 12px">
      <div style="position: absolute; inset: 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 12px"></div>
      <p style="position: relative; margin: 0; font-family: 'Amiri Quran', serif; font-size: 20px; line-height: 2.2; color: #FFFFFF; text-align: center">[نص الآية من المصدر]</p>
      <span style="position: relative; font-size: 12px; color: rgba(255,255,255,.85)">[السورة] · [رقم الآية]</span>
      <span style="position: absolute; bottom: 22px; font-size: 10px; color: rgba(255,255,255,.7)">ayattla.com</span>
    </div>
  </div>

  <div style="flex: 1; background: #FFFFFF; border-top: 1px solid #E3EBE5; border-radius: 22px 22px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">القالب</span>
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px">
        <button aria-label="قالب إطار" style="aspect-ratio: 1; border-radius: 12px; border: 2px solid {{accent}}; background: linear-gradient(160deg, #4E6E57, #22322A)"></button>
        <button aria-label="قالب فاتح" style="aspect-ratio: 1; border-radius: 12px; border: 1px solid #E3EBE5; background: #FBF9F2"></button>
        <button aria-label="قالب ليلي" style="aspect-ratio: 1; border-radius: 12px; border: 0; background: linear-gradient(160deg, #2C3E58, #0E1626)"></button>
        <button aria-label="قالب ذهبي" style="aspect-ratio: 1; border-radius: 12px; border: 0; background: linear-gradient(160deg, #B49B6E, #5A4630)"></button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">المقاس</span>
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px">
        <button style="height: 40px; border-radius: 10px; border: 2px solid {{accent}}; background: #EEF5EF; font: 600 13px 'IBM Plex Sans Arabic', sans-serif; color: #2C5E37">١:١</button>
        <button style="height: 40px; border-radius: 10px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">٤:٥</button>
        <button style="height: 40px; border-radius: 10px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">٩:١٦</button>
        <button style="height: 40px; border-radius: 10px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">١٦:٩</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">حجم الخط</span>
      <div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 12px">أ</span><div style="flex: 1; height: 6px; border-radius: 3px; background: #EEF5EF; position: relative"><div style="width: 55%; height: 6px; border-radius: 3px; background: {{accent}}"></div></div><span style="font-size: 18px">أ</span></div>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">صورة من الجهاز</button>
      <button style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">حولها إلى فيديو</button>
    </div>
    <button style="height: 48px; border-radius: 24px; border: 0; background: #EEF5EF; color: #2C5E37; font: 600 14px 'IBM Plex Sans Arabic', sans-serif">حفظ في الصور</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#427E45"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#427E45' };
}
}
</script>
</body>
</html>
