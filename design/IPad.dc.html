<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>iPad الاستوديو</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#2C5E37}a:hover{color:#1F4628}
</style>
</helmet>
<div dir="rtl" style="width: 1180px; height: 820px; box-sizing: border-box; background: #F7FAF7; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: grid; grid-template-columns: 240px 1fr 360px; overflow: hidden">
  <nav aria-label="الأقسام" style="background: #FFFFFF; border-inline-end: 1px solid #E3EBE5; padding: 36px 14px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 22px; font-weight: 600; color: #427E45; padding: 0 12px 18px">آيات تتلى</span>
    <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1C2B20; font-size: 15px">الرئيسية</a>
    <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1C2B20; font-size: 15px">القرآن</a>
    <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2C5E37; font-size: 15px; font-weight: 600; background: #EEF5EF">الاستوديو</a>
    <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1C2B20; font-size: 15px">مكتبتي</a>
    <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1C2B20; font-size: 15px">الأدوات</a>
    <div style="height: 1px; background: #E3EBE5; margin: 14px 12px"></div>
    <span style="font-size: 12px; color: #56665B; padding: 0 12px">مشروع جديد</span>
    <a href="#" style="height: 40px; padding: 0 12px; display: flex; align-items: center; text-decoration: none; color: #44544A; font-size: 14px">مقطع قرآني</a>
    <a href="#" style="height: 40px; padding: 0 12px; display: flex; align-items: center; text-decoration: none; color: #44544A; font-size: 14px">بطاقة آية</a>
    <a href="#" style="height: 40px; padding: 0 12px; display: flex; align-items: center; text-decoration: none; color: #44544A; font-size: 14px">حالة</a>
    <a href="#" style="height: 40px; padding: 0 12px; display: flex; align-items: center; text-decoration: none; color: #44544A; font-size: 14px">إهداء</a>
  </nav>

  <main style="padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; align-items: center">
    <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">[عنوان المشروع]</h1>
      <div style="display: flex; gap: 8px">
        <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 14px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">حفظ مسودة</button>
        <button style="height: 44px; padding: 0 22px; border-radius: 22px; border: 0; background: {{accent}}; color: #FFFFFF; font: 600 14px 'IBM Plex Sans Arabic', sans-serif">تصدير الفيديو</button>
      </div>
    </div>
    <div style="width: 324px; height: 576px; border-radius: 22px; overflow: hidden; position: relative; background: linear-gradient(180deg, #2B3A31 0%, #44594A 55%, #1B2620 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 28px; box-sizing: border-box; gap: 16px">
      <span style="font-size: 11px; color: rgba(255,255,255,.8)">[صورة مسجد من Pixabay]</span>
      <p style="margin: 0; font-family: 'Amiri Quran', serif; font-size: 24px; line-height: 2.2; color: #FFFFFF; text-align: center">[نص الآيات مع <span style="color: {{highlight}}">تظليل الكلمة</span>]</p>
      <p style="margin: 0; font-size: 13px; color: rgba(255,255,255,.85); text-align: center">[الترجمة المختارة]</p>
      <span style="position: absolute; bottom: 14px; font-size: 11px; color: rgba(255,255,255,.7)">ayattla.com</span>
    </div>
    <div style="width: 100%; max-width: 560px; height: 48px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3EBE5; display: flex; gap: 4px; padding: 8px; box-sizing: border-box">
      <div style="flex: 3; border-radius: 5px; background: #CFE2D3"></div><div style="flex: 2; border-radius: 5px; background: #CFE2D3"></div><div style="flex: 4; border-radius: 5px; background: {{accent}}"></div><div style="flex: 2; border-radius: 5px; background: #CFE2D3"></div><div style="flex: 3; border-radius: 5px; background: #CFE2D3"></div>
    </div>
  </main>

  <aside aria-label="خيارات المحرر" style="background: #FFFFFF; border-inline-start: 1px solid #E3EBE5; padding: 28px 22px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label style="font-size: 13px; font-weight: 600" for="ip-surah">السورة والآيات</label>
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px">
        <select id="ip-surah" style="height: 44px; border-radius: 12px; border: 1px solid #E3EBE5; padding: 0 10px; font: 400 14px 'IBM Plex Sans Arabic', sans-serif; background: #FFFFFF"><option>[السورة]</option></select>
        <input aria-label="من آية" value="١" style="height: 44px; border-radius: 12px; border: 1px solid #E3EBE5; text-align: center; font: 400 14px 'IBM Plex Sans Arabic', sans-serif">
        <input aria-label="إلى آية" value="٥" style="height: 44px; border-radius: 12px; border: 1px solid #E3EBE5; text-align: center; font: 400 14px 'IBM Plex Sans Arabic', sans-serif">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label style="font-size: 13px; font-weight: 600" for="ip-rec">القارئ</label>
      <select id="ip-rec" style="height: 44px; border-radius: 12px; border: 1px solid #E3EBE5; padding: 0 10px; font: 400 14px 'IBM Plex Sans Arabic', sans-serif; background: #FFFFFF"><option>[اسم القارئ] · تظليل الكلمات</option></select>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">المقاس</span>
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px">
        <button style="height: 40px; border-radius: 10px; border: 2px solid {{accent}}; background: #EEF5EF; font: 600 13px 'IBM Plex Sans Arabic', sans-serif; color: #2C5E37">٩:١٦</button>
        <button style="height: 40px; border-radius: 10px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">١:١</button>
        <button style="height: 40px; border-radius: 10px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">٤:٥</button>
        <button style="height: 40px; border-radius: 10px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">١٦:٩</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">الخلفية — صور المساجد</span>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <button aria-label="خلفية ١" style="aspect-ratio: 3/4; border-radius: 8px; border: 2px solid {{accent}}; background: linear-gradient(180deg, #4C6656, #22322A)"></button>
        <button aria-label="خلفية ٢" style="aspect-ratio: 3/4; border-radius: 8px; border: 0; background: linear-gradient(180deg, #8A7A5C, #3D3428)"></button>
        <button aria-label="خلفية ٣" style="aspect-ratio: 3/4; border-radius: 8px; border: 0; background: linear-gradient(180deg, #5D7891, #23324A)"></button>
        <button aria-label="خلفية ٤" style="aspect-ratio: 3/4; border-radius: 8px; border: 0; background: linear-gradient(180deg, #B49B6E, #5A4630)"></button>
        <button aria-label="خلفية ٥" style="aspect-ratio: 3/4; border-radius: 8px; border: 0; background: linear-gradient(180deg, #3E5A4A, #12201A)"></button>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <span style="font-size: 14px">تظليل الكلمات</span>
      <span aria-hidden="true" style="width: 50px; height: 30px; border-radius: 15px; background: {{accent}}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#427E45"},"highlight":{"editor":"color","default":"#F3D27A"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#427E45', highlight: this.props.highlight ?? '#F3D27A' };
}
}
</script>
</body>
</html>
