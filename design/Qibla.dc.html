<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>القبلة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7FAF7; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; align-items: center; overflow: hidden">
  <div style="align-self: stretch; padding: 54px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2B20" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <span style="font-size: 16px; font-weight: 600">اتجاه القبلة</span>
    <span style="width: 44px"></span>
  </div>

  <span style="margin-top: 24px; font-size: 14px; color: #44544A">[المدينة] · [المسافة إلى مكة]</span>
  <span style="margin-top: 6px; font-size: 40px; font-weight: 600; color: #2C5E37">[الزاوية]°</span>

  <svg width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="بوصلة تشير إلى القبلة" style="margin-top: 26px">
    <circle cx="150" cy="150" r="140" fill="#FFFFFF" stroke="#E3EBE5" stroke-width="2"></circle>
    <circle cx="150" cy="150" r="112" fill="none" stroke="#EEF5EF" stroke-width="14"></circle>
    <text x="150" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#44544A">ش</text>
    <text x="150" y="276" text-anchor="middle" font-size="16" fill="#56665B">ج</text>
    <text x="268" y="156" text-anchor="middle" font-size="16" fill="#56665B">ق</text>
    <text x="32" y="156" text-anchor="middle" font-size="16" fill="#56665B">غ</text>
    <g transform="rotate({{angle}} 150 150)">
      <path d="M150 52 L166 150 L150 140 L134 150 Z" fill="{{accent}}"></path>
      <path d="M150 248 L166 150 L150 160 L134 150 Z" fill="#CFE2D3"></path>
      <rect x="139" y="34" width="22" height="22" rx="3" fill="#1C2B20"></rect>
      <rect x="139" y="40" width="22" height="3" fill="#C8A84E"></rect>
    </g>
    <circle cx="150" cy="150" r="8" fill="#FFFFFF" stroke="{{accent}}" stroke-width="3"></circle>
  </svg>

  <div style="margin-top: 30px; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 22px; background: #EEF5EF; color: #2C5E37; font-size: 14px; font-weight: 500">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="2" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>
    أنت باتجاه القبلة
  </div>
  <span style="margin-top: 18px; padding: 0 32px; font-size: 13px; color: #56665B; text-align: center; line-height: 1.8">أبعد الهاتف عن المعادن والمغناطيس. إذا لم تتوفر البوصلة يظهر الاتجاه على الخريطة.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#427E45"},"angle":{"editor":"number","default":0,"min":-180,"max":180,"step":1},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#427E45', angle: this.props.angle ?? 0 };
}
}
</script>
</body>
</html>
