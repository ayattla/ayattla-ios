<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الأذكار</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Amiri&amp;display=swap">
<style>
body{margin:0}
a{color:#2C5E37}a:hover{color:#1F4628}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7FAF7; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2B20" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <span style="font-size: 16px; font-weight: 600">أذكار الصباح</span>
    <span style="font-size: 13px; color: #56665B; width: 44px; text-align: center">٣ / [العدد]</span>
  </div>
  <div style="padding: 0 16px"><div style="height: 4px; border-radius: 2px; background: #E3EBE5"><div style="width: 22%; height: 4px; border-radius: 2px; background: {{accent}}"></div></div></div>

  <div style="flex: 1; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="flex: 1; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3EBE5; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px">
      <p style="margin: 0; font-family: 'Amiri', serif; font-size: 21px; line-height: 2.1; text-align: center; color: #1C2B20">[نص الذكر من حصن المسلم كما هو بتشكيله]</p>
      <div style="height: 1px; background: #E3EBE5"></div>
      <span style="font-size: 12px; color: #56665B; text-align: center">[المرجع] · [الفضل إن وجد]</span>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #EEF5EF">
        <button aria-label="تشغيل التسجيل" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></button>
        <div style="flex: 1; display: flex; gap: 3px; align-items: center; height: 28px">
          <div style="width: 3px; height: 10px; border-radius: 2px; background: #427E45"></div><div style="width: 3px; height: 18px; border-radius: 2px; background: #427E45"></div><div style="width: 3px; height: 24px; border-radius: 2px; background: #427E45"></div><div style="width: 3px; height: 14px; border-radius: 2px; background: #427E45"></div><div style="width: 3px; height: 20px; border-radius: 2px; background: #9DBFA4"></div><div style="width: 3px; height: 12px; border-radius: 2px; background: #9DBFA4"></div><div style="width: 3px; height: 22px; border-radius: 2px; background: #9DBFA4"></div><div style="width: 3px; height: 16px; border-radius: 2px; background: #9DBFA4"></div><div style="width: 3px; height: 8px; border-radius: 2px; background: #9DBFA4"></div><div style="width: 3px; height: 18px; border-radius: 2px; background: #9DBFA4"></div>
        </div>
        <span style="font-size: 12px; color: #2C5E37">التسجيل الرسمي</span>
      </div>
    </div>

    <button aria-label="عد مرة" style="height: 150px; border-radius: 24px; border: 0; background: linear-gradient(160deg, #2F6B3B, #427E45); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'IBM Plex Sans Arabic', sans-serif">
      <span style="font-size: 52px; font-weight: 600; line-height: 1">{{remaining}}</span>
      <span style="font-size: 13px; opacity: .9">متبق — اضغط للعد</span>
    </button>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">اصنع حالة</button>
      <button style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">مشاركة</button>
      <button style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">التالي</button>
    </div>
  </div>
  <div style="height: 20px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#427E45"},"remaining":{"editor":"number","default":3,"min":0,"max":100,"step":1},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#427E45', remaining: this.props.remaining ?? 3 };
}
}
</script>
</body>
</html>
