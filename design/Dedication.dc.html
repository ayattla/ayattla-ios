<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإهداء</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#2C5E37}a:hover{color:#1F4628}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7FAF7; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2B20" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <span style="font-size: 16px; font-weight: 600">إهداء تلاوة</span>
    <span style="width: 44px"></span>
  </div>

  <div style="padding: 4px 16px 0; display: flex; gap: 6px">
    <div style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></div>
    <div style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></div>
    <div style="flex: 1; height: 4px; border-radius: 2px; background: #D7E4DA"></div>
  </div>
  <span style="padding: 8px 16px 0; font-size: 12px; color: #56665B">الخطوة ٢ من ٣ — نص الإهداء</span>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">المهدى إليه
      <input value="[الاسم]" style="height: 48px; border-radius: 12px; border: 1px solid #E3EBE5; padding: 0 14px; font: 400 15px 'IBM Plex Sans Arabic', sans-serif; background: #FFFFFF">
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">المناسبة</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: {{accent}}; color: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif">رمضان</button>
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3EBE5; background: #FFFFFF; color: #1C2B20; font: 500 13px 'IBM Plex Sans Arabic', sans-serif">العيد</button>
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3EBE5; background: #FFFFFF; color: #1C2B20; font: 500 13px 'IBM Plex Sans Arabic', sans-serif">الجمعة</button>
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3EBE5; background: #FFFFFF; color: #1C2B20; font: 500 13px 'IBM Plex Sans Arabic', sans-serif">صدقة جارية</button>
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3EBE5; background: #FFFFFF; color: #1C2B20; font: 500 13px 'IBM Plex Sans Arabic', sans-serif">بلا مناسبة</button>
      </div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">سطر الإهداء
      <textarea rows="3" style="border-radius: 12px; border: 1px solid #E3EBE5; padding: 12px 14px; font: 400 15px/1.8 'IBM Plex Sans Arabic', sans-serif; background: #FFFFFF; resize: none">[نص الإهداء الذي يكتبه المستخدم]</textarea>
    </label>

    <div style="border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, #4C6656, #22322A); height: 190px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; padding: 16px; box-sizing: border-box">
      <span style="font-size: 12px; color: rgba(255,255,255,.85)">إهداء إلى [الاسم]</span>
      <p style="margin: 0; font-family: 'Amiri Quran', serif; font-size: 17px; line-height: 2.2; color: #FFFFFF; text-align: center">[الآيات المختارة]</p>
      <span style="font-size: 11px; color: rgba(255,255,255,.8)">[سطر الإهداء]</span>
    </div>
  </div>

  <div style="padding: 12px 16px 34px; display: flex; gap: 10px; border-top: 1px solid #E3EBE5; background: #FFFFFF">
    <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 14px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">السابق</button>
    <button style="flex: 2; height: 48px; border-radius: 24px; border: 0; background: {{accent}}; color: #FFFFFF; font: 600 14px 'IBM Plex Sans Arabic', sans-serif">التالي: الخلفية والقارئ</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#427E45"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#427E45' };
}
}
</script>
</body>
</html>
