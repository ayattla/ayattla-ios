<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>محرر الحالة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Aref+Ruqaa&amp;display=swap">
<style>
body{margin:0}
a{color:#2C5E37}a:hover{color:#1F4628}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7FAF7; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C2B20" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <span style="font-size: 16px; font-weight: 600">حالة واتساب</span>
    <button style="height: 40px; padding: 0 18px; border-radius: 20px; border: 0; background: {{accent}}; color: #FFFFFF; font: 600 14px 'IBM Plex Sans Arabic', sans-serif">تصدير</button>
  </div>

  <div role="tablist" aria-label="نوع الحالة" style="margin: 4px 16px 12px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 14px; background: #EAF1EB">
    <button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 11px; background: transparent; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #44544A">آية</button>
    <button role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 11px; background: #FFFFFF; font: 600 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">ذكر</button>
    <button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 11px; background: transparent; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #44544A">حديث</button>
  </div>

  <div style="display: flex; justify-content: center">
    <div style="width: 200px; height: 356px; border-radius: 18px; overflow: hidden; position: relative; background: linear-gradient(180deg, #2C3E58, #0E1626); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; gap: 10px">
      <p style="margin: 0; font-family: 'Aref Ruqaa', serif; font-size: 20px; line-height: 1.9; color: #FFFFFF; text-align: center">[نص الذكر من حصن المسلم]</p>
      <span style="font-size: 10px; color: rgba(255,255,255,.8)">[المرجع]</span>
      <div style="position: absolute; bottom: 12px; inset-inline: 16px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25)"><div style="width: 40%; height: 3px; border-radius: 2px; background: #FFFFFF"></div></div>
    </div>
  </div>

  <div style="margin-top: 14px; flex: 1; background: #FFFFFF; border-top: 1px solid #E3EBE5; border-radius: 22px 22px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">الذكر
      <select style="height: 44px; border-radius: 12px; border: 1px solid #E3EBE5; padding: 0 10px; font: 400 14px 'IBM Plex Sans Arabic', sans-serif; background: #FFFFFF"><option>[الباب] · [الذكر]</option></select>
    </label>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border-radius: 12px; background: #EEF5EF">
      <span style="font-size: 14px; color: #1C2B20">صوت الذكر المسجل</span>
      <span aria-hidden="true" style="width: 50px; height: 30px; border-radius: 15px; background: {{accent}}; display: flex; align-items: center; padding: 3px; box-sizing: border-box"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">المدة</span><span style="color: #56665B">{{seconds}} ث من ٦٠</span></div>
      <div style="height: 6px; border-radius: 3px; background: #EEF5EF"><div style="width: 25%; height: 6px; border-radius: 3px; background: {{accent}}"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">الخلفية</span>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <button aria-label="خلفية ١" style="aspect-ratio: 3/4; border-radius: 8px; border: 2px solid {{accent}}; background: linear-gradient(180deg, #2C3E58, #0E1626)"></button>
        <button aria-label="خلفية ٢" style="aspect-ratio: 3/4; border-radius: 8px; border: 0; background: linear-gradient(180deg, #4C6656, #22322A)"></button>
        <button aria-label="خلفية ٣" style="aspect-ratio: 3/4; border-radius: 8px; border: 0; background: linear-gradient(180deg, #8A7A5C, #3D3428)"></button>
        <button aria-label="خلفية ٤" style="aspect-ratio: 3/4; border-radius: 8px; border: 0; background: linear-gradient(180deg, #5D7891, #23324A)"></button>
        <button aria-label="خلفية ٥" style="aspect-ratio: 3/4; border-radius: 8px; border: 0; background: linear-gradient(180deg, #3E5A4A, #12201A)"></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#427E45"},"seconds":{"editor":"number","default":15,"min":5,"max":60,"step":1},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#427E45', seconds: this.props.seconds ?? 15 };
}
}
</script>
</body>
</html>
