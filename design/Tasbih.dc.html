<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المسبحة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;family=Amiri&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7FAF7; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; align-items: center; overflow: hidden">
  <div style="align-self: stretch; padding: 54px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2B20" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <span style="font-size: 16px; font-weight: 600">المسبحة</span>
    <button aria-label="إعادة العداد" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C5E37" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.3M4 4v4h4"></path></svg></button>
  </div>

  <div role="tablist" aria-label="العبارة" style="align-self: stretch; display: flex; gap: 8px; padding: 10px 16px; overflow: hidden">
    <button role="tab" aria-selected="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: {{accent}}; color: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; white-space: nowrap">[العبارة ١]</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3EBE5; background: #FFFFFF; color: #1C2B20; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; white-space: nowrap">[العبارة ٢]</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3EBE5; background: #FFFFFF; color: #1C2B20; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; white-space: nowrap">[العبارة ٣]</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px dashed #B9CDBE; background: transparent; color: #2C5E37; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; white-space: nowrap">إضافة</button>
  </div>

  <p style="margin: 36px 24px 0; font-family: 'Amiri', serif; font-size: 26px; line-height: 2; text-align: center">[عبارة التسبيح من المصدر]</p>

  <button aria-label="تسبيحة" style="margin-top: 36px; width: 250px; height: 250px; border-radius: 125px; border: 10px solid #EEF5EF; background: linear-gradient(160deg, #2F6B3B, #427E45); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'IBM Plex Sans Arabic', sans-serif; box-sizing: border-box">
    <span style="font-size: 64px; font-weight: 600; line-height: 1">{{count}}</span>
    <span style="font-size: 14px; opacity: .9">من {{target}}</span>
  </button>

  <div style="margin-top: 30px; display: flex; gap: 24px; font-size: 13px; color: #44544A">
    <span>الدورات: [عدد]</span>
    <span>مجموع اليوم: [عدد]</span>
  </div>
  <div style="margin-top: 18px; display: flex; gap: 10px">
    <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">الهدف: ٣٣</button>
    <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #E3EBE5; background: #FFFFFF; font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20">اهتزاز عند الإكمال</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#427E45"},"count":{"editor":"number","default":12,"min":0,"max":1000,"step":1},"target":{"editor":"number","default":33,"min":1,"max":1000,"step":1},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#427E45', count: this.props.count ?? 12, target: this.props.target ?? 33 };
}
}
</script>
</body>
</html>
