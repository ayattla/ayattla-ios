<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الترحيب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2C5E37}a:hover{color:#1F4628}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #EEF5EF 0%, #FFFFFF 55%); font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; align-items: center; padding: 0 28px; overflow: hidden">
  <a href="#" style="align-self: flex-start; margin-top: 60px; font-size: 14px; padding: 10px 0">تخطي</a>
  <div style="margin-top: 50px; width: 132px; height: 132px; border-radius: 36px; background: linear-gradient(160deg, #2F6B3B, #2E9145); display: flex; align-items: center; justify-content: center">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"></path><path d="M12 6v14"></path></svg>
  </div>
  <span style="margin-top: 14px; font-size: 13px; color: #56665B">[شعار آيات تتلى من مجلد brand]</span>

  <h1 style="margin: 44px 0 0; font-size: 28px; font-weight: 600; text-align: center; color: #2F6B3B">{{title}}</h1>
  <p style="margin: 14px 0 0; font-size: 16px; line-height: 1.8; text-align: center; color: #44544A">{{body}}</p>

  <div style="margin-top: 36px; display: flex; gap: 8px" aria-hidden="true">
    <span style="width: 24px; height: 8px; border-radius: 4px; background: #427E45"></span>
    <span style="width: 8px; height: 8px; border-radius: 4px; background: #CFE2D3"></span>
    <span style="width: 8px; height: 8px; border-radius: 4px; background: #CFE2D3"></span>
  </div>

  <div style="margin-top: auto; margin-bottom: 48px; align-self: stretch; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 54px; border-radius: 27px; border: 0; background: #427E45; color: #FFFFFF; font: 600 16px 'IBM Plex Sans Arabic', sans-serif">التالي</button>
    <span style="font-size: 12px; color: #56665B; text-align: center">مجاني بالكامل · بلا حساب · يعمل دون إنترنت</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"اصنع مقطعك القرآني"},"body":{"editor":"text","default":"اختر الآيات والقارئ والخلفية، وصدر مقطعا بتظليل الكلمات على جهازك مباشرة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { title: this.props.title ?? 'اصنع مقطعك القرآني', body: this.props.body ?? 'اختر الآيات والقارئ والخلفية، وصدر مقطعا بتظليل الكلمات على جهازك مباشرة' };
}
}
</script>
</body>
</html>
