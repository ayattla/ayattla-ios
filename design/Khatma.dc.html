<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>خطة الختمة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2C5E37}a:hover{color:#1F4628}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7FAF7; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1C2B20; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C2B20" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <span style="font-size: 16px; font-weight: 600">خطة الختمة</span>
    <a href="#" style="font-size: 13px; width: 44px; text-align: center">تعديل</a>
  </div>

  <div style="margin: 8px 16px 0; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3EBE5; padding: 22px; display: flex; align-items: center; gap: 20px">
    <svg width="110" height="110" viewBox="0 0 110 110" role="img" aria-label="نسبة الإنجاز">
      <circle cx="55" cy="55" r="46" fill="none" stroke="#EEF5EF" stroke-width="12"></circle>
      <circle cx="55" cy="55" r="46" fill="none" stroke="{{accent}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="168" transform="rotate(-90 55 55)"></circle>
      <text x="55" y="62" text-anchor="middle" font-size="22" font-weight="600" fill="#1C2B20">٤٢٪</text>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 18px; font-weight: 600">ختمة في [المدة]</span>
      <span style="font-size: 13px; color: #44544A">اليوم [رقم] · [عدد] صفحة يوميا</span>
      <span style="font-size: 13px; color: #44544A">الختم المتوقع: [التاريخ]</span>
    </div>
  </div>

  <div style="margin: 16px 16px 0; border-radius: 18px; padding: 16px; background: #EEF5EF; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 600; color: #2C5E37">ورد اليوم</span>
    <span style="font-size: 14px">من صفحة [من] إلى [إلى] · [السورة]</span>
    <div style="display: flex; gap: 8px">
      <button style="flex: 2; height: 44px; border-radius: 22px; border: 0; background: {{accent}}; color: #FFFFFF; font: 600 14px 'IBM Plex Sans Arabic', sans-serif">ابدأ القراءة</button>
      <button style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid #CFE2D3; background: #FFFFFF; color: #1C2B20; font: 500 14px 'IBM Plex Sans Arabic', sans-serif">تم</button>
    </div>
  </div>

  <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 15px; font-weight: 600">توزيع على الصلوات</span>
    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px">
      <div style="height: 64px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; gap: 2px"><span>الفجر</span><span>[ص]</span></div>
      <div style="height: 64px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; gap: 2px"><span>الظهر</span><span>[ص]</span></div>
      <div style="height: 64px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3EBE5; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; gap: 2px"><span>العصر</span><span style="color: #56665B">[ص]</span></div>
      <div style="height: 64px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3EBE5; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; gap: 2px"><span>المغرب</span><span style="color: #56665B">[ص]</span></div>
      <div style="height: 64px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3EBE5; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; gap: 2px"><span>العشاء</span><span style="color: #56665B">[ص]</span></div>
    </div>
  </div>

  <div style="margin: 16px 16px 0; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3EBE5; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">ختمة جماعية</span><span style="font-size: 12px; color: #56665B">وزع الأجزاء على الأهل والأصدقاء</span></div>
    <a href="#" style="font-size: 13px">إنشاء</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#427E45"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#427E45' };
}
}
</script>
</body>
</html>
